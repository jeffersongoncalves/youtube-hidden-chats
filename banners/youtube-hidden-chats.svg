<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A0A0B"/>
      <stop offset="1" stop-color="#18181B"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#FBBF24" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#FBBF24" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#27272A" stroke-width="0.6"/>
    </pattern>
  </defs>

  <!-- Backgrounds -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.4"/>
  <ellipse cx="950" cy="310" rx="410" ry="290" fill="url(#glow)"/>

  <!-- Top label -->
  <circle cx="84" cy="66" r="4" fill="#FBBF24"/>
  <text x="102" y="71" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500" letter-spacing="2" fill="#A1A1AA">CHROME EXTENSION</text>

  <!-- Title -->
  <text x="80" y="280" font-family="Inter, system-ui, sans-serif" font-size="62" font-weight="800" letter-spacing="-2" fill="#FAFAFA">YouTube Hidden</text>
  <text x="80" y="348" font-family="Inter, system-ui, sans-serif" font-size="62" font-weight="800" letter-spacing="-2" fill="#FAFAFA">Chats</text>

  <!-- Tagline -->
  <text x="80" y="404" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="600" fill="#FBBF24">Hide the YouTube live chat</text>

  <!-- Description -->
  <text x="80" y="444" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="400" fill="#A1A1AA">Manifest V3, CSS-only, zero config. Reclaims the</text>
  <text x="80" y="468" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="400" fill="#A1A1AA">empty column so the player reflows full width.</text>

  <!-- Right visual: browser mock -->
  <g>
    <!-- Window -->
    <rect x="700" y="150" width="430" height="300" rx="14" fill="#18181B" stroke="#3F3F46" stroke-width="1.5"/>
    <!-- Title bar -->
    <rect x="700" y="150" width="430" height="40" rx="14" fill="#0A0A0B"/>
    <rect x="700" y="176" width="430" height="14" fill="#0A0A0B"/>
    <circle cx="724" cy="170" r="5" fill="#EF4444"/>
    <circle cx="744" cy="170" r="5" fill="#FBBF24"/>
    <circle cx="764" cy="170" r="5" fill="#10B981"/>
    <rect x="800" y="162" width="300" height="16" rx="8" fill="#18181B"/>
    <text x="816" y="174" font-family="ui-monospace, monospace" font-size="11" fill="#52525B">youtube.com/watch</text>

    <!-- Player (full width now) -->
    <rect x="724" y="212" width="382" height="150" rx="8" fill="#0A0A0B" stroke="#27272A" stroke-width="1"/>
    <path d="M898 270 L928 287 L898 304 Z" fill="url(#amber)"/>
    <rect x="724" y="372" width="250" height="10" rx="5" fill="#27272A"/>
    <rect x="724" y="392" width="180" height="10" rx="5" fill="#27272A"/>
    <rect x="724" y="412" width="210" height="10" rx="5" fill="#1F1F23"/>

    <!-- Removed chat column (ghost + slash) -->
    <rect x="990" y="212" width="116" height="210" rx="8" fill="none" stroke="#3F3F46" stroke-width="1.5" stroke-dasharray="5 5"/>
    <line x1="1000" y1="412" x2="1096" y2="222" stroke="#FBBF24" stroke-width="3" stroke-linecap="round"/>
    <text x="1048" y="445" font-family="ui-monospace, monospace" font-size="11" fill="#71717A" text-anchor="middle">chat hidden</text>
  </g>

  <!-- Footer pills -->
  <g font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500">
    <rect x="80" y="545" width="108" height="30" rx="15" fill="#18181B" stroke="#FBBF24"/>
    <text x="134" y="565" fill="#FBBF24" text-anchor="middle">Manifest V3</text>

    <rect x="200" y="545" width="72" height="30" rx="15" fill="#18181B" stroke="#27272A"/>
    <text x="236" y="565" fill="#A1A1AA" text-anchor="middle">CSS</text>

    <rect x="284" y="545" width="86" height="30" rx="15" fill="#18181B" stroke="#27272A"/>
    <text x="327" y="565" fill="#A1A1AA" text-anchor="middle">Chrome</text>

    <rect x="382" y="545" width="64" height="30" rx="15" fill="#18181B" stroke="#27272A"/>
    <text x="414" y="565" fill="#A1A1AA" text-anchor="middle">MIT</text>
  </g>

  <!-- Username -->
  <text x="1120" y="595" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#52525B" text-anchor="end">@jeffersongoncalves</text>
</svg>
