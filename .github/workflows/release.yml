name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build extension zip
        run: |
          zip -r "youtube-hidden-chats-${GITHUB_REF_NAME}.zip" \
            manifest.json \
            hide.css \
            icons

      - name: Attach zip to release
        uses: softprops/action-gh-release@v2
        with:
          files: youtube-hidden-chats-*.zip
          generate_release_notes: true
